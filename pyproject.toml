[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "rustats"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
]
[tool.maturin]
features = ["pyo3/extension-module"]
profile = "release"

[tool.uv.sources]
bottleneck-stubs = { git = "https://github.com/py-stubs/bottleneck-stubs.git" }

[dependency-groups]
dev = [
    "bottleneck>=1.5.0",
    "bottleneck-stubs",
    "polars>=1.33.0",
]
